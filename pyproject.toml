[project]
name = "huiguan-battery-v2"
version = "2.0.0"
description = "Battery probabilistic research, single Skill agent and independent carbon decisions"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
  "python-multipart>=0.0.20,<1", "argon2-cffi>=23,<26", "httpx>=0.27,<1",
  "Pillow>=11,<13", "numpy>=2.2,<3", "scipy>=1.15,<2", "pandas>=2.2,<3",
  "h5py>=3.13,<4", "scikit-learn>=1.6,<2", "ngboost>=0.5,<0.6",
  "torch>=2.6,<3", "PyYAML>=6,<7", "requests>=2.32,<3", "pyarrow>=19,<24",
  "ortools>=9.10,<10", "jsonschema>=4.23,<5", "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-timeout>=2,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "battery_platform"]
testpaths = ["battery_platform/tests", "model_lab/tests/v2", "tests/content"]
